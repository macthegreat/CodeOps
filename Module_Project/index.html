<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Eats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <h1>Addis Eats</h1>

            <input
                type="text"
                id="search"
                placeholder="Search dishes..."
            >
        </header>

        <div class="content">

            <!-- Menu -->
            <section class="menu-section">
                <h2>Our Menu</h2>

                <div class="menu-grid">

                    <article class="menu-card">
                        <h3>Doro Wat</h3>
                        <p>Main</p>
                        <span class="spicy">🌶️ Spicy</span>
                        <strong>240 ETB</strong>
                        <button id="addToCart">Add to Order</button>
                    </article>

                
                </div>
            </section>

            <!-- Order -->
            <aside class="order-section">

                <h2>Your Order</h2>

                <div class="order-item">
                    <span>Tibs (x1)</span>
                    <strong>280 ETB</strong>
                    <button class="remove">×</button>
                </div>

                <div class="order-item">
                    <span>Injera Firfir (x1)</span>
                    <strong>100 ETB</strong>
                    <button class="remove">×</button>
                </div>

                <div class="order-item">
                    <span>Derek Tibs (x1)</span>
                    <strong>310 ETB</strong>
                    <button class="remove">×</button>
                </div>

                <div class="total">
                    <span>Total:</span>
                    <strong>690 ETB</strong>
                </div>

            </aside>


        </div>
        <div class="footer">
             <p>&copy; 2026 IBT CodeOps. All rights reserved. <span class="telebirr">we accept Telebirr</span></span></p>
        </div>

    </main>
    <script src="script.js"></script>

</body>
</html>
