<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Eats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="checkout-modal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Checkout with Telebirr</h2>
        <p>Enter your Ethiopian phone number to receive a payment request.</p>
        
        <form id="checkout-form">
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="0919385189 or +251919385189" 
                    required
                >
                <small id="phone-error" class="error-msg"></small>
            </div>
            
            <div class="order-summary">
                <p>Total to Pay: <strong id="modal-total">0 ETB</strong></p>
            </div>

            <button type="submit" class="pay-btn">Pay with Telebirr</button>
        </form>
    </div>
</div>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <h1>Addis Eats</h1>

            <input
                type="text"
                id="search"
                placeholder="Search dishes..."
            >
        </header>

        <div class="content">

            <!-- Menu -->
            <section class="menu-section">
                <h2>Our Menu</h2>

                <div class="menu-grid">


                </div>
            </section>

            <!-- Order -->
            <aside class="order-section">

                <h2>Your Order</h2>

              

            </aside>


        </div>
        <div class="total">
    <!-- <span>Total:</span> -->
    <!-- <strong id="total-amount">0 ETB</strong> -->
</div>

<!-- <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button> -->
        <div class="footer">
             <p>&copy; 2026 IBT CodeOps. All rights reserved. <span class="telebirr">we accept Telebirr</span></span></p>
        </div>

    </main>
    <script src="script.js"></script>

</body>
</html>
