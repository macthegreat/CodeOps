<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="birr-watch">
      <h1 id="main-header">World Currency to ETB</h1>
      <p id="slogan">Real-time exchange rates and reliable conversions.</p>
      
      <div class="data-entry">
        <h3 class="da-titles" >Currency Converter</h3>
        <label for="s-currency" class="da-labels">Source Currency</label>
       <select name="sourcce-currency" id="s-currency">
  <option value="">--Please choose an option--</option>
  <option value="USD">USD</option>
  <option value="BPR">BPR</option>
  <option value="RAND">Rand</option>
  <option value="Pound">Pound</option>
   <option value="ETB">ETB</option>
</select>
<label for="T-currency" class="da-labels">Target Currency</label>
<select name="t-currency" id="T-currency">
      <option value="">--Please choose an option--</option>
    <option value="ETB">ETB</option>
    <option value="USD">USD</option>
  <option value="BPR">BPR</option>
  <option value="RAND">Rand</option>
  <option value="Pound">Pound</option>
</select>

<label for="amount" class="da-labels">Amount</label>
<input type="number" placeholder="Enter Amount..">

<button type="submit" id="convert">Convert</button>
<div class="result">
    <h3 class="da-titles">Conversion Result</h3>
    <p id="result">56,000</p>
    <p>1USD=180ETB - Market Rate</p>
    <button type="button">Add to Watchlist</button>

    

</div>

      </div>
       <div class="watchlist">
        <h2>My Waatchlist</h2>

    </div>
    </div>
   
  </body>
</html>
