<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBT Collage</title>
</head>
<body>
    <header>
        <h1>IBT CodeOps</h1>
        <nav class="nav-bar">
            <ul>
                <li><img src="images/ibtlogo.jpeg" alt="ibt logo" id="logo"></li>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>

        </nav>

    </header>

    <div class="intro">
        <h2>Welcome to IBT CodeOps</h2>
        <img src="logo.png" alt="this is ibt logo">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, voluptatum.</p>
    </div>
    <div class="container">
        <form action="" method="">
            <h2>Registration Form</h2>
            <label for="fname">First Name</label>
            <input type="text" id="fname" placeholder="Enter your first name">
            <label for="lname">Last Name</label>
            <input type="text" id="lname" placeholder="Enter your last name">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">
            <button type="submit">Submit</button>
        </form>
    </div>
    <footer class="footer">
        <p>&copy; 2024 IBT CodeOps. All rights reserved.</p>

        <a href="#"><img src="ig.png" alt="instagram"></a>   
        <a href="#"><img src="fb.png" alt="facebook"></a>     
        <a href="#"><img src="tiktok.png" alt="tiktok"></a>          

    </footer>
</body>
</html>
